# XcodeGen project definition (the .xcodeproj is generated, not committed):  xcodegen generate
name: SpexardWetter
options:
  bundleIdPrefix: com.enzozacharias
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Base URL of the weather server; CI sets it from the repository variable API_BASE_URL.
    # Empty = the app asks for the server address on first start.
    API_BASE_URL: ""
targets:
  SpexardWetter:
    type: application
    platform: iOS
    sources:
      - path: SpexardWetter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzozacharias.spexardwetter
        PRODUCT_NAME: SpexardWetter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    info:
      path: SpexardWetter/Info.plist
      properties:
        CFBundleDisplayName: Spexard Wetter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        SpexardAPIBaseURL: $(API_BASE_URL)
        NSLocalNetworkUsageDescription: Die App holt die Wetterdaten von deinem Wetterserver im Heimnetz.
        NSAppTransportSecurity:
          # private app talking to the own server (LAN over http or the tailnet over https)
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
