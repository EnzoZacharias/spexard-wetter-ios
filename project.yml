# XcodeGen project definition (the .xcodeproj is generated, not committed):  xcodegen generate
name: SpexardWetter
options:
  bundleIdPrefix: com.enzozacharias
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Base URL of the weather server; CI sets it from the repository variable API_BASE_URL.
    # Empty = the app asks for the server address on first start.
    API_BASE_URL: ""
targets:
  SpexardWetter:
    type: application
    platform: iOS
    sources:
      - path: SpexardWetter
    dependencies:
      - target: SpexardWetterWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzozacharias.spexardwetter
        PRODUCT_NAME: SpexardWetter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    info:
      path: SpexardWetter/Info.plist
      properties:
        CFBundleDisplayName: Spexard Wetter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        SpexardAPIBaseURL: $(API_BASE_URL)
        # links from the widgets (spexardwetter://radar, ://warnungen, ...)
        CFBundleURLTypes:
          - CFBundleURLName: com.enzozacharias.spexardwetter
            CFBundleURLSchemes:
              - spexardwetter
        NSLocalNetworkUsageDescription: Die App holt die Wetterdaten von deinem Wetterserver im Heimnetz.
        NSAppTransportSecurity:
          # private app talking to the own server (LAN over http or the tailnet over https)
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Widgets (home screen and lock screen). No App Group: the widget asks the server itself and
  # takes the built-in address from its own Info.plist (same API_BASE_URL build setting).
  SpexardWetterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SpexardWetterWidget
      - path: SpexardWetter/Data/API.swift
      - path: SpexardWetter/Data/Format.swift
      - path: SpexardWetter/Data/Models.swift
      - path: SpexardWetter/Data/Models+Alerts.swift
      - path: SpexardWetter/Data/Symbols.swift
      - path: SpexardWetter/Data/WeatherDerived.swift
      - path: SpexardWetter/Data/LiveStrip.swift
      - path: SpexardWetter/Shared
      - path: SpexardWetter/UI/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzozacharias.spexardwetter.widget
        PRODUCT_NAME: SpexardWetterWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: SpexardWetterWidget/Info.plist
      properties:
        CFBundleDisplayName: Spexard Wetter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpexardAPIBaseURL: $(API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
